<style>
/* Layout: one iPhone-sized app. Framed on desktop, full-bleed on a phone. Monochrome like the CM mark, depth from liquid glass over soft graphite light. */
:root{
  --bg:#E8E8EB; --bg2:#F7F7F9; --ink:#0C0C0E; --ink2:#55565D; --ink3:#8E8F96;
  --line:rgba(12,12,18,.08); --chip:rgba(12,12,18,.055); --on-ink:#FFFFFF;
  --glass:rgba(255,255,255,.50); --glass-strong:rgba(255,255,255,.74); --glass-edge:rgba(255,255,255,.85);
  --glass-shade:rgba(0,0,0,.06); --shadow:0 12px 34px rgba(18,18,28,.10), 0 2px 6px rgba(18,18,28,.05);
  --blob-a:#C4C6CF; --blob-b:#FFFFFF; --blob-c:#ABAEB9; --blob-d:#D9D3CB;
  --good:#0F9D66; --warn:#B97C06; --bad:#D2433B; --good-bg:rgba(15,157,102,.12); --warn-bg:rgba(185,124,6,.12); --bad-bg:rgba(210,67,59,.11);
  --accent:#2F6BFF; --i-fail:#E0383E; --i-1:#EA6A1F; --i-2:#C99400; --i-3:#17A35A; --i-warm:#3A9BE0; --i-cl:#8B4DE8;
  --c-sila:#2F6BFF; --c-hyp:#8A4DF0; --c-kon:#EA6A1F; --c-reh:#17A35A; --c-mob:#0FA3B1;
  --page:#D9D9DE; --bezel:#111113;
  --f-ui:"Inter","Geist", -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  --f-num:"Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r-lg:28px; --r-md:20px; --r-sm:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#050506; --bg2:#121215; --ink:#F3F3F5; --ink2:#A4A5AD; --ink3:#6B6C74;
  --line:rgba(255,255,255,.08); --chip:rgba(255,255,255,.07); --on-ink:#0C0C0E;
  --glass:rgba(36,36,40,.46); --glass-strong:rgba(42,42,47,.72); --glass-edge:rgba(255,255,255,.16);
  --glass-shade:rgba(0,0,0,.35); --shadow:0 14px 40px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3);
  --blob-a:#2C2D34; --blob-b:#17171B; --blob-c:#3B3D47; --blob-d:#2A2622;
  --good:#3DDC97; --warn:#F2B544; --bad:#FF6D63; --good-bg:rgba(61,220,151,.13); --warn-bg:rgba(242,181,68,.13); --bad-bg:rgba(255,109,99,.13);
  --accent:#7BA2FF; --i-fail:#FF6B6E; --i-1:#FF9A55; --i-2:#F5C542; --i-3:#4ADE8B; --i-warm:#7CC6FF; --i-cl:#B48CFF;
  --c-sila:#7BA2FF; --c-hyp:#B794FF; --c-kon:#FF9A55; --c-reh:#4ADE8B; --c-mob:#5EE0EA;
  --page:#0D0D0F; --bezel:#000; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#050506; --bg2:#121215; --ink:#F3F3F5; --ink2:#A4A5AD; --ink3:#6B6C74;
  --line:rgba(255,255,255,.08); --chip:rgba(255,255,255,.07); --on-ink:#0C0C0E;
  --glass:rgba(36,36,40,.46); --glass-strong:rgba(42,42,47,.72); --glass-edge:rgba(255,255,255,.16);
  --glass-shade:rgba(0,0,0,.35); --shadow:0 14px 40px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3);
  --blob-a:#2C2D34; --blob-b:#17171B; --blob-c:#3B3D47; --blob-d:#2A2622;
  --good:#3DDC97; --warn:#F2B544; --bad:#FF6D63; --good-bg:rgba(61,220,151,.13); --warn-bg:rgba(242,181,68,.13); --bad-bg:rgba(255,109,99,.13);
  --accent:#7BA2FF; --i-fail:#FF6B6E; --i-1:#FF9A55; --i-2:#F5C542; --i-3:#4ADE8B; --i-warm:#7CC6FF; --i-cl:#B48CFF;
  --c-sila:#7BA2FF; --c-hyp:#B794FF; --c-kon:#FF9A55; --c-reh:#4ADE8B; --c-mob:#5EE0EA;
  --page:#0D0D0F; --bezel:#000; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--f-ui);-webkit-font-smoothing:antialiased;overflow:hidden}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:10px}

.stage{height:100%;display:flex;align-items:center;justify-content:center;gap:40px;padding:16px}
.side{max-width:280px;display:flex;flex-direction:column;gap:14px;color:var(--ink2);font-size:13.5px;line-height:1.5}
.side h1{font-size:22px;color:var(--ink);margin:0;letter-spacing:-.02em;font-weight:600}
.side .hint{display:flex;gap:10px;align-items:flex-start}
.side .hint b{color:var(--ink);font-weight:600}
@media (max-width:900px){.side{display:none}}

.phone{position:relative;width:390px;height:min(844px,100%);border-radius:56px;background:var(--bezel);padding:11px;box-shadow:0 40px 80px rgba(0,0,0,.25),0 0 0 1.5px rgba(255,255,255,.06) inset}
.screen{position:relative;width:100%;height:100%;border-radius:46px;overflow:hidden;overflow:clip;background:var(--bg);isolation:isolate}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;border-radius:20px;background:#000;z-index:60}
.statusbar{position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:4px 34px 0 40px;z-index:55;font-weight:600;font-size:16px;pointer-events:none}
.statusbar .sb-icons{display:flex;gap:6px;align-items:center}
@media (max-width:500px){
  .stage{padding:0}
  .phone{width:100%;height:100%;border-radius:0;padding:0;box-shadow:none;background:var(--bg)}
  .screen{border-radius:0}
  .island,.statusbar{display:none}
}

/* ambient light behind the glass */
.ambient{position:absolute;inset:-20%;z-index:0;pointer-events:none;
  background:
   radial-gradient(38% 30% at 18% 14%, var(--blob-b) 0%, transparent 70%),
   radial-gradient(42% 34% at 88% 22%, var(--blob-a) 0%, transparent 70%),
   radial-gradient(46% 36% at 12% 72%, var(--blob-c) 0%, transparent 72%),
   radial-gradient(40% 30% at 86% 88%, var(--blob-d) 0%, transparent 70%),
   var(--bg);
  animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(-4%,3%,0) rotate(4deg)}}
@media (prefers-reduced-motion:reduce){.ambient{animation:none}.view.enter{animation:none!important}}

/* liquid glass */
.glass{position:relative;background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(185%);backdrop-filter:blur(26px) saturate(185%);
  border:.5px solid var(--glass-edge);box-shadow:var(--shadow), inset 0 1px 0 var(--glass-edge), inset 0 -1px 0 var(--glass-shade)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(155deg, rgba(255,255,255,.38) 0%, rgba(255,255,255,0) 38%, rgba(255,255,255,0) 70%, rgba(255,255,255,.12) 100%);mix-blend-mode:soft-light}
.glass.strong{background:var(--glass-strong)}

.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;z-index:1;padding:64px 18px 120px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.view::-webkit-scrollbar{display:none}
.view.detail{padding-top:104px}
.view.enter{animation:slidein .32s cubic-bezier(.2,.8,.2,1)}
.view.enter-back{animation:fadein .25s ease}
@keyframes slidein{from{transform:translateX(28px);opacity:.0}to{transform:none;opacity:1}}
@keyframes fadein{from{opacity:.4}to{opacity:1}}
@media (max-width:500px){.view{padding-top:calc(env(safe-area-inset-top,0px) + 20px)}.view.detail{padding-top:calc(env(safe-area-inset-top,0px) + 70px)}}

.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--ink2)}
.faint{color:var(--ink3)}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:500}
.title-xl{font-size:34px;font-weight:600;letter-spacing:-.035em;margin:0;line-height:1.05;text-wrap:balance}
.title-l{font-size:22px;font-weight:600;letter-spacing:-.025em;margin:0}
.title-m{font-size:17px;font-weight:600;letter-spacing:-.015em;margin:0}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:10px 4px -4px}
.sec h3{font-size:13px;font-weight:600;margin:0;letter-spacing:.01em;color:var(--ink2)}
.sec button{font-size:13px;color:var(--ink);font-weight:500}
.small{font-size:13px}
.tiny{font-size:11.5px}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.card{border-radius:var(--r-lg);padding:16px}
.list{border-radius:var(--r-lg);padding:4px 0;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;text-align:left;position:relative}
.li + .li::after{content:"";position:absolute;top:0;left:68px;right:16px;height:.5px;background:var(--line)}
.li.plain + .li.plain::after{left:16px}
.li:active{background:var(--chip)}
.chev{color:var(--ink3);flex:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 22px;border-radius:999px;font-weight:600;font-size:16px;letter-spacing:-.01em;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.ink{background:var(--ink);color:var(--on-ink)}
.btn.block{width:100%}
.btn.sm{height:38px;padding:0 16px;font-size:14px}
.btn.ghost{background:var(--chip)}
.btn.danger{color:var(--bad);background:var(--bad-bg)}
.iconbtn{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;flex:none}
.iconbtn.sm{width:36px;height:36px}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px}
.chips::-webkit-scrollbar{display:none}
.chip{height:34px;padding:0 14px;border-radius:999px;font-size:13.5px;font-weight:500;white-space:nowrap;background:var(--chip);color:var(--ink2);flex:none}
.chip.on{background:var(--ink);color:var(--on-ink)}

.seg{display:flex;padding:4px;border-radius:999px;gap:2px}
.seg button{flex:1;height:34px;border-radius:999px;font-size:13.5px;font-weight:500;color:var(--ink2)}
.seg button.on{background:var(--glass-strong);color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.08), inset 0 1px 0 var(--glass-edge)}

.pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.good{color:var(--good);background:var(--good-bg)}
.pill.warn{color:var(--warn);background:var(--warn-bg)}
.pill.bad{color:var(--bad);background:var(--bad-bg)}
.pill.neutral{color:var(--ink2);background:var(--chip)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink);flex:none}

.avatar{flex:none;border-radius:50%;display:grid;place-items:center;font-weight:600;color:var(--ink);background:linear-gradient(145deg,var(--blob-b),var(--blob-c));overflow:hidden;box-shadow:inset 0 0 0 .5px var(--glass-edge)}
.avatar img{width:100%;height:100%;object-fit:cover}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;color:var(--ink2);font-weight:500;padding-left:4px}
.input{width:100%;height:50px;border-radius:16px;border:.5px solid var(--line);background:var(--glass-strong);padding:0 16px;font-size:16px;outline:none}
.input:focus{border-color:var(--ink3)}
textarea.input{height:auto;min-height:84px;padding:13px 16px;resize:none;line-height:1.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.kpi{border-radius:var(--r-md);padding:14px 14px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .v{font-size:28px;font-weight:600;letter-spacing:-.04em;line-height:1}
.kpi .l{font-size:12px;color:var(--ink2)}
.delta{font-size:11.5px;font-weight:600}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)}

/* tab bar */
.tabbar{position:absolute;left:14px;right:14px;bottom:18px;z-index:40;height:66px;border-radius:999px;display:flex;align-items:center;padding:6px}
@media (max-width:500px){.tabbar{bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}}
.tabbar.six .tab{font-size:9.5px}.tabbar.six .tab svg{width:21px;height:21px}
.tab{flex:1;height:100%;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:500;color:var(--ink2);position:relative;transition:color .2s}
.tab.on{color:var(--ink)}
.tab.on::before{content:"";position:absolute;inset:0 2px;border-radius:999px;background:var(--chip);box-shadow:inset 0 1px 0 var(--glass-edge)}
.tab svg{position:relative}
.tabbar.glide .tab.on::before{opacity:0}
.tabpill{position:absolute;top:6px;bottom:6px;left:0;border-radius:999px;pointer-events:none;will-change:transform,width;background:linear-gradient(120deg,rgba(0,0,0,.16),rgba(0,184,240,.12));box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 4px 14px rgba(0,0,0,.12)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tabpill{background:linear-gradient(120deg,rgba(0,0,0,.45),rgba(0,200,255,.30));box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 4px 18px rgba(0,0,0,.25)}}
:root[data-theme="dark"] .tabpill{background:linear-gradient(120deg,rgba(0,0,0,.45),rgba(0,200,255,.30));box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 4px 18px rgba(0,0,0,.25)}
@media (prefers-reduced-motion: reduce){.tabpill{transition:none!important}}
.tab > span:not(.badge){position:relative}
.badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px;z-index:2}

/* detail nav */
.navbar{position:absolute;top:54px;left:12px;right:12px;z-index:45;display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:none}
.navbar > *{pointer-events:auto}
.navbar .ntitle{position:absolute;left:64px;right:64px;text-align:center;font-weight:600;font-size:16px;opacity:0;transition:opacity .2s;pointer-events:none}
.navbar.scrolled .ntitle{opacity:1}
@media (max-width:500px){.navbar{top:calc(env(safe-area-inset-top,0px) + 8px)}}

/* sheet */
.scrim{position:absolute;inset:0;z-index:70;background:rgba(0,0,0,.28);animation:fadein .2s}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;z-index:71;border-radius:38px;max-height:86%;overflow-y:auto;padding:10px 20px 26px;animation:up .32s cubic-bezier(.2,.8,.2,1);scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--ink3);opacity:.5;margin:0 auto 14px}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}

.toast{position:absolute;top:62px;left:50%;transform:translateX(-50%);z-index:90;border-radius:999px;padding:11px 18px;font-weight:500;font-size:14px;display:flex;gap:8px;align-items:center;white-space:nowrap;animation:up .3s}
@media (max-width:500px){.toast{top:calc(env(safe-area-inset-top,0px) + 12px)}}

/* code card */
.code{font-family:var(--f-num);font-size:34px;font-weight:600;letter-spacing:.14em}

/* chart */
.nextw{border-radius:26px;padding:20px;color:var(--grad-ink);background:var(--grad);box-shadow:0 14px 34px rgba(150,190,0,.18)}
.nextw .title-l{color:var(--grad-ink)}
.nextw .eyebrow{color:rgba(10,10,11,.62)!important;font-weight:700}
.nextw .hero-t{font-size:36px;font-weight:900;line-height:.95;letter-spacing:-.025em;text-transform:uppercase;margin:4px 0 0;text-wrap:balance}
.wpill{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;background:rgba(10,10,11,.1);color:var(--grad-ink)}
.swipe{position:relative;height:62px;border-radius:31px;background:#0A0A0B;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.swipe .sw-t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-left:52px;font-weight:800;font-size:13.5px;letter-spacing:.14em;color:#D4FF3A;pointer-events:none;transition:opacity .2s}
.swipe .sw-t em{font-style:normal;opacity:.4;margin-left:8px;letter-spacing:-.04em;animation:swh 1.6s ease-in-out infinite}
@keyframes swh{50%{opacity:.9;transform:translateX(3px)}}
.swipe .sw-tr{position:absolute;left:5px;top:5px;bottom:5px;width:52px;border-radius:26px;background:linear-gradient(90deg,rgba(212,255,58,.12),rgba(212,255,58,.5));display:flex;align-items:center;padding-left:20px;font-weight:800;font-size:13.5px;letter-spacing:.14em;color:#D4FF3A;white-space:nowrap;overflow:hidden;opacity:0;pointer-events:none}
.swipe .sw-th{position:absolute;left:5px;top:5px;width:52px;height:52px;border-radius:50%;background:#D4FF3A;color:#0A0A0B;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.35);cursor:grab;touch-action:none}
.swipe.back .sw-th,.swipe.back .sw-tr{transition:left .35s cubic-bezier(.34,1.3,.5,1),width .35s cubic-bezier(.34,1.3,.5,1)}
.nextw .btn.dk{background:rgba(10,10,11,.1);color:var(--grad-ink)}
.wmark{position:absolute;left:50%;top:56%;width:82%;transform:translate(-50%,-50%);opacity:.075;z-index:0;pointer-events:none}
.wset{display:grid;grid-template-columns:26px minmax(0,1fr) 62px 52px 36px;gap:8px;align-items:center;padding:7px 0;border-top:.5px solid var(--line)}
.wset.head{border-top:0;padding:2px 0 0;font-size:11px;color:var(--ink3);font-weight:500}
.wset.head span:nth-child(n+3){text-align:center}
.wset input{width:100%;height:36px;border-radius:10px;border:0;background:var(--chip);text-align:center;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);outline:none;font-family:inherit}
.wset input:focus{box-shadow:0 0 0 2px var(--accent)}
.wset.done input{opacity:.55}
.chk{width:36px;height:36px;border-radius:11px;background:var(--chip);display:grid;place-items:center;color:var(--ink3);transition:background .2s,color .2s}
.chk.on{background:var(--good);color:#fff}
.bigtime{font-size:46px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1;color:var(--acc-text)}
.restbar{position:absolute;left:14px;right:14px;bottom:18px;z-index:41;border-radius:999px;min-height:64px;display:flex;align-items:center;gap:8px;padding:6px 8px 6px 22px;animation:up .3s}
@media (max-width:500px){.restbar{bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}}
.feel{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.feel button{border-radius:20px;background:var(--chip);padding:12px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:5px;transition:transform .15s,box-shadow .2s,background .2s}
.feel button .e{font-size:36px;line-height:1;filter:grayscale(.7);opacity:.65;transition:transform .2s,filter .2s,opacity .2s}
.feel button .t{font-size:12px;font-weight:600;color:var(--ink2);text-align:center;line-height:1.15}
.feel button.on{background:color-mix(in srgb,var(--fc) 16%,transparent);box-shadow:inset 0 0 0 2px var(--fc)}
.feel button.on .e{filter:none;opacity:1;transform:scale(1.14)}
.feel button.on .t{color:var(--ink)}
.feelpill{display:inline-flex;align-items:center;gap:5px;font-weight:600}
.lock{position:absolute;inset:0;z-index:120;color:#fff;display:flex;flex-direction:column;align-items:center;padding:70px 14px 40px;background:radial-gradient(60% 40% at 20% 15%,rgba(76,141,255,.55),transparent 70%),radial-gradient(50% 40% at 90% 60%,rgba(0,200,255,.35),transparent 70%),radial-gradient(60% 50% at 10% 95%,rgba(110,80,255,.4),transparent 70%),#070A14;animation:fadein .3s;cursor:pointer;text-align:center}
.lock .clock{font-size:88px;font-weight:600;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;margin-top:6px}
.lock .la{margin-top:auto;width:100%;border-radius:30px;padding:16px 18px;text-align:left;background:rgba(20,24,36,.55);-webkit-backdrop-filter:blur(30px) saturate(1.6);backdrop-filter:blur(30px) saturate(1.6);border:1px solid rgba(255,255,255,.14);box-shadow:0 20px 50px rgba(0,0,0,.4)}
.lock .island{position:absolute;top:14px;left:50%;transform:translateX(-50%);height:34px;border-radius:20px;background:#000;display:flex;align-items:center;gap:10px;padding:0 14px 0 8px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.rpe{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.rpe button{height:40px;border-radius:11px;background:var(--chip);font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink2)}
.rpe button.on{background:var(--grad);color:var(--grad-ink)}
.isel.sm{height:26px;border-radius:999px;padding:0 22px 0 9px;font-size:12px;background-position:right 7px center;background-size:9px;max-width:100%}
.lastline{display:flex;align-items:center;gap:6px;width:100%;text-align:left;padding:8px 10px;border-radius:12px;background:var(--chip);font-size:12.5px;color:var(--ink2)}
.lastline b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}
.upflame{font-size:13px;line-height:1;margin-left:2px}
.fire{position:absolute;z-index:130;pointer-events:none;display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-50%)}
.fire .f{font-size:46px;line-height:1;filter:drop-shadow(0 6px 14px rgba(255,120,30,.55));animation:fireup 1.5s cubic-bezier(.2,.8,.2,1) forwards}
.fire .l{margin-top:4px;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:700;color:#fff;background:linear-gradient(120deg,#FF7A3D,#FF4D6D);white-space:nowrap;animation:firelab 1.5s ease forwards}
.fire i{position:absolute;top:18px;left:50%;width:6px;height:6px;border-radius:50%;background:#FFB13D;animation:spark 0.9s ease-out forwards}

/* Volt theme: black and white base with one electric lime accent, heavy uppercase titles, frosted glass bars */
:root{--bg:#EDEDE8;--bg2:#F7F7F4;--ink:#0A0A0B;--ink2:#55555A;--ink3:#8A8A8F;--line:rgba(0,0,0,.08);--chip:rgba(0,0,0,.055);--on-ink:#fff;--glass:rgba(255,255,255,.80);--glass-strong:rgba(255,255,255,.93);--glass-edge:rgba(255,255,255,.95);--glass-shade:rgba(0,0,0,.05);--shadow:0 8px 24px rgba(0,0,0,.07),0 0 0 .5px rgba(0,0,0,.06);--accent:#5E8C00;--grad:#D4FF3A;--grad-ink:#0A0A0B;--acc-text:#0A0A0B;--acc-soft:rgba(10,10,11,.10);--tabon:#0A0A0B;--page:#DCDCD6;color-scheme:light}
.screen{background:var(--bg)!important}
.ambient{background:var(--bg)!important;animation:none!important}
.glass::before{background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,0) 40%)!important}
.btn.ink,.chip.on{background:var(--grad)!important;color:var(--grad-ink)!important;box-shadow:none!important;font-weight:700}
.title-xl{font-weight:900!important;letter-spacing:-.025em!important;text-transform:uppercase;line-height:1!important}
.title-l{font-weight:800}
.kpi .v{font-weight:900!important}
.eyebrow{color:var(--ink3)!important;font-weight:700;letter-spacing:.14em}
.code{color:var(--ink)}
.avatar{background:var(--ink)!important;color:var(--bg)!important;box-shadow:none!important}
.chart rect[opacity="1"]{fill:var(--acc-text)}
.tabbar{background:var(--glass)!important;-webkit-backdrop-filter:blur(30px) saturate(180%)!important;backdrop-filter:blur(30px) saturate(180%)!important}
.tab{font-weight:600}
.tab.on{color:var(--tabon)!important;font-weight:800}
.tabpill{background:var(--acc-soft)!important;border:1px solid var(--acc-soft);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)!important}
:root[data-theme="light"] .tabbar{border:1px solid rgba(0,0,0,.16)!important;box-shadow:0 16px 36px rgba(0,0,0,.22),0 2px 8px rgba(0,0,0,.10),inset 0 1px 0 #fff!important;background:rgba(255,255,255,.84)!important}
:root[data-theme="light"] .tab:not(.on){color:#0A0A0B!important;opacity:.62}

@media (prefers-color-scheme: light){
:root:not([data-theme="dark"]) .tabbar{border:1px solid rgba(0,0,0,.16)!important;box-shadow:0 16px 36px rgba(0,0,0,.22),0 2px 8px rgba(0,0,0,.10),inset 0 1px 0 #fff!important;background:rgba(255,255,255,.84)!important}
:root:not([data-theme="dark"]) .tab:not(.on){color:#0A0A0B!important;opacity:.62}
:root:not([data-theme="dark"]) .glass{border-color:rgba(0,0,0,.06)!important}
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0A0A0B;--bg2:#141416;--ink:#F5F5F2;--ink2:#A1A1A6;--ink3:#6E6E73;--line:rgba(255,255,255,.08);--chip:rgba(255,255,255,.07);--on-ink:#0A0A0B;--glass:rgba(24,24,27,.78);--glass-strong:rgba(32,32,36,.92);--glass-edge:rgba(255,255,255,.10);--glass-shade:rgba(0,0,0,.4);--shadow:0 12px 32px rgba(0,0,0,.45);--accent:#D4FF3A;--good:#34E39A;--bad:#FF5D73;--warn:#FFC24B;--grad:#D4FF3A;--grad-ink:#0A0A0B;--acc-text:#D4FF3A;--acc-soft:rgba(212,255,58,.16);--tabon:#D4FF3A;--page:#050506;color-scheme:dark}
:root:not([data-theme="light"]) .mark{background:#fff}
}

/* smoothness: transitions, no replayed animations, lighter scrolling */
button,a,input,select,textarea,label{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.view,.sheet{overscroll-behavior:contain}
.view .glass{-webkit-backdrop-filter:none;backdrop-filter:none}

.iconbtn,.chip,button.card,button.kpi,.tab{transition:transform .14s ease}
.iconbtn:active,.chip:active,button.card:active,button.kpi:active{transform:scale(.97)}
.still{animation:none!important}
.view.enter{animation:vin .3s cubic-bezier(.2,.8,.2,1) both}
.view.enter-back{animation:vback .3s cubic-bezier(.2,.8,.2,1) both}
.view.enter-tab{animation:vfade .2s ease both}
.view.ghost{z-index:0;pointer-events:none}
.view.ghost.out-l{animation:voutl .18s ease-in both}
.view.ghost.out-r{animation:voutr .18s ease-in both}
.view.ghost.out-f{animation:voutf .16s ease both}
.view.enter-tab.from-r{animation:vtinr .4s cubic-bezier(.32,.72,0,1) both}
.view.enter-tab.from-l{animation:vtinl .4s cubic-bezier(.32,.72,0,1) both}
.view.ghost.out-tl{animation:vtoutl .4s cubic-bezier(.32,.72,0,1) both}
.view.ghost.out-tr{animation:vtoutr .4s cubic-bezier(.32,.72,0,1) both}
@keyframes vtinr{from{transform:translateX(100%)}to{transform:none}}
@keyframes vtinl{from{transform:translateX(-100%)}to{transform:none}}
@keyframes vtoutl{to{transform:translateX(-100%);opacity:.4}}
@keyframes vtoutr{to{transform:translateX(100%);opacity:.4}}
@keyframes vin{from{transform:translate3d(36px,0,0);opacity:0}to{transform:none;opacity:1}}
@keyframes vback{from{transform:translate3d(-28px,0,0);opacity:0}to{transform:none;opacity:1}}
@keyframes vfade{from{opacity:0}to{opacity:1}}
@keyframes voutl{to{transform:translate3d(-28px,0,0);opacity:0}}
@keyframes voutr{to{transform:translate3d(36px,0,0);opacity:0}}
@keyframes voutf{to{opacity:0}}
.sheet{animation:sheetin .34s cubic-bezier(.2,.85,.25,1)}
@keyframes sheetin{from{transform:translate3d(0,110%,0)}to{transform:none}}
.sheet.out{animation:sheetout .24s cubic-bezier(.4,0,1,1) forwards;pointer-events:none}
.scrim.out{animation:scrimout .24s ease forwards;pointer-events:none}
@keyframes sheetout{to{transform:translate3d(0,110%,0)}}
@keyframes scrimout{to{opacity:0}}
.toast{animation:toastin .28s cubic-bezier(.2,.8,.2,1)}
.toast.out{animation:toastout .2s ease forwards}
@keyframes toastin{from{transform:translate(-50%,-12px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes toastout{to{transform:translate(-50%,-8px);opacity:0}}
@media (prefers-reduced-motion:reduce){.view.enter,.view.enter-back,.view.enter-tab,.sheet,.toast{animation:none!important}}
/* workout logging B */
.wohead{display:flex;align-items:center;gap:10px;padding:2px 4px 0}
.wohead .bar{flex:1;height:6px;border-radius:3px;background:var(--chip);overflow:hidden}
.wohead .bar b{display:block;height:100%;background:var(--grad);border-radius:3px;transition:width .3s}
.woex{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px}
.wonum{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;font-weight:600;background:var(--chip);color:var(--ink2)}
.wonum.ok{background:var(--good);color:#06101F}
.wodots{display:flex;gap:4px;flex:none}.wodots i{width:7px;height:7px;border-radius:50%;background:var(--chip)}.wodots i.on{background:var(--good)}
.woopen{border-color:color-mix(in srgb,var(--accent) 45%,transparent)!important}
.wos{display:flex;align-items:center;gap:10px}
.wos .val{flex:1;min-width:0;height:48px;border-radius:15px;background:var(--chip);display:flex;align-items:center;gap:6px;padding:0 12px;font-size:16.5px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink);text-align:left}
.wos .val .x{color:var(--ink3);font-weight:500}
.wos .val.ghost .v{color:var(--ink3)}
.wos.done .val{background:color-mix(in srgb,var(--good) 11%,transparent)}
.wos.cur .val{box-shadow:inset 0 0 0 2px var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.wos .chk{width:48px;height:48px;border-radius:15px}
.wopf{flex:1;border-radius:18px;padding:10px 14px;background:var(--chip);text-align:left}
.wopf.on{box-shadow:inset 0 0 0 2px var(--accent);background:color-mix(in srgb,var(--accent) 13%,transparent)}
.wopf .v{font-size:34px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap;overflow:hidden}
.wopf.on .v::after{content:'';display:inline-block;width:2px;height:28px;background:var(--accent);margin-left:3px;vertical-align:-3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.woqc{display:flex;gap:6px;flex-wrap:wrap}.woqc button{height:34px;padding:0 12px;border-radius:999px;background:var(--chip);font-size:13.5px;font-weight:600;white-space:nowrap;color:var(--ink)}
.woqc button.ip{color:var(--h);background:color-mix(in srgb,var(--h) 13%,transparent)}.woqc button.on{box-shadow:inset 0 0 0 1.5px currentColor}
.wokp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.wokp button{height:50px;border-radius:16px;background:var(--chip);display:grid;place-items:center;font-size:22px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.wokp button:active{transform:scale(.96)}
/* template editor A */
.edrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;border-top:.5px solid var(--line)}
.edrow:first-child{border-top:0}
.idots{display:flex;gap:3px;flex:none}.idots i{width:8px;height:8px;border-radius:50%;background:var(--chip);display:block}
.edstp{flex:1;display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:18px;background:var(--chip)}
.edstp .b{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 12%,transparent);flex:none}
.edstp .v{flex:1;text-align:center;min-width:0}.edstp .v b{display:block;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.edsets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.edsets button{display:flex;flex-direction:column;align-items:center;gap:4px}
.edsets .ip{width:100%;justify-content:center;height:34px;font-size:12.5px}
.edsets .ip.none{--h:var(--ink3)}
.edrest{display:flex;gap:6px;flex-wrap:wrap}
.edadv{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center}
.edadv input{height:38px;border-radius:11px;border:0;background:var(--chip);text-align:center;font-size:15px;font-weight:600;color:var(--ink);outline:none;font-family:inherit;width:100%}
.edin{width:100%;border:0;background:transparent;outline:none;text-align:center;font:inherit;font-size:18px;font-weight:800;color:var(--ink);padding:0}.edin::placeholder{color:var(--ink3);font-weight:600}
.pkbox{width:26px;height:26px;border-radius:8px;border:2px solid var(--ink3);display:grid;place-items:center;flex:none;color:#fff}
.pkbox.on{border:0;background:var(--grad);color:var(--grad-ink)}

function adherence(cid){const c=client(cid);const weeks=Math.max(1,Math.min(4,Math.ceil((now-new Date(c.joined))/DAY/7)));const n=sessOf(cid).filter(s=>daysAgo(s.date)<weeks*7).length;return Math.min(100,Math.round(n/(c.target*weeks)*100));}
function unread(cid){return (S.messages[cid]||[]).filter(m=>m.by==='client'&&!m.read).length;}
function unreadAll(){return S.clients.reduce((a,c)=>a+unread(c.id),0);}
function mySess(){const ids=new Set(S.clients.map(c=>c.id));return S.sessions.filter(s=>ids.has(s.clientId));}
function weekly(cid,weeks){const out=[];const pool=cid?S.sessions:mySess();for(let w=weeks-1;w>=0;w--){let v=0,n=0;pool.forEach(s=>{if(cid&&s.clientId!==cid)return;const d=daysAgo(s.date);if(d>=w*7&&d<w*7+7){v+=volume(s);n++;}});out.push({w:w,v:v,n:n});}return out;}
function status(cid){const c=client(cid);const d=lastDays(cid);if(daysAgo(c.joined)<=14)return {k:'new',t:'Nový',c:'neutral'};if(d===null||d>=7)return {k:'idle',t:(d===null?'Bez tréninku':d+' '+pl(d,'den','dny','dní')+' bez tréninku'),c:'bad'};const a=adherence(cid);if(a<60)return {k:'low',t:'Docházka '+a+' %',c:'warn'};return {k:'ok',t:'Aktivní',c:'good'};}
function weightTrend(cid){const m=S.metrics.filter(x=>x.clientId===cid&&x.kg>0).sort((a,b)=>a.date.localeCompare(b.date));if(m.length<2)return null;return {first:m[0].kg,last:m[m.length-1].kg,series:m};}
function exList(cid){const cnt={};sessOf(cid).forEach(s=>s.ex.forEach(e=>{if(!e.timed)cnt[exK(e)]=(cnt[exK(e)]||0)+1;}));return Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]);}
function exProgress(cid,name){return sessOf(cid).slice().reverse().map(s=>{const e=s.ex.find(x=>exK(x)===name);if(!e)return null;let kg=0,reps=0,e1=0;e.sets.forEach(x=>{if(x.kg>kg||(x.kg===kg&&x.reps>reps)){kg=x.kg;reps=x.reps;}if(x.kg>0)e1=Math.max(e1,x.kg*(1+x.reps/30));});if(!kg)reps=Math.max.apply(null,e.sets.map(x=>x.reps));return {d:s.date,kg:kg,reps:reps,e1:e1};}).filter(Boolean);}
function liftTrend(cid,name){return sessOf(cid).slice().reverse().map(s=>({d:s.date,v:e1rm(s,name)})).filter(x=>x.v>0);}
function pending(){return mySess().filter(s=>!s.seen||s.comments.length===0&&daysAgo(s.date)<=3).sort((a,b)=>b.date.localeCompare(a.date));}

function ring(p,size,stroke){size=size||40;stroke=stroke||4;const r=(size-stroke)/2,C=2*Math.PI*r;const col=p>=80?'var(--good)':p>=60?'var(--warn)':'var(--bad)';
 return '<svg class="ring" width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'"><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--chip)" stroke-width="'+stroke+'"/><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="'+stroke+'" stroke-linecap="round" stroke-dasharray="'+(C*p/100)+' '+C+'" transform="rotate(-90 '+size/2+' '+size/2+')"/><text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" style="font-family:var(--f-ui);font-size:'+(size*.27)+'px;font-weight:600;fill:var(--ink)">'+p+'</text></svg>';}

function lineChart(pts,opts){
 opts=opts||{};const W=320,H=opts.h||130,pl_=30,pr=12,pt=14,pb=20;
 if(pts.length<2)return '<div class="empty">Zatím málo dat pro graf.</div>';
 const vs=pts.map(p=>p.v);let mn=Math.min.apply(null,vs),mx=Math.max.apply(null,vs);
 const pad=(mx-mn)*.18||1;mn-=pad;mx+=pad;
 const step=niceStep((mx-mn)/3);mn=Math.floor(mn/step)*step;mx=Math.ceil(mx/step)*step;
 const x=i=>pl_+(W-pl_-pr)*i/(pts.length-1),y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
 let g='';for(let v=mn;v<=mx+1e-9;v+=step){g+='<line x1="'+pl_+'" x2="'+(W-pr)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(pl_-6)+'" y="'+(y(v)+3)+'" text-anchor="end">'+fmtAxis(v)+'</text>';}
 const d=pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
 const area=d+' L'+x(pts.length-1)+' '+(H-pb)+' L'+pl_+' '+(H-pb)+' Z';
 const gid='g'+uid();const li=pts.length-1;
 const lab='<text x="'+pl_+'" y="'+(H-4)+'">'+fmtD(pts[0].d)+'</text><text x="'+(W-pr)+'" y="'+(H-4)+'" text-anchor="end">'+fmtD(pts[li].d)+'</text>';
 return '<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opts.label||'graf')+'"><defs><linearGradient id="'+gid+'" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".22"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>'+g+'<path d="'+area+'" fill="url(#'+gid+')"/><path d="'+d+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="'+x(li)+'" cy="'+y(pts[li].v)+'" r="4.5" fill="var(--accent)" stroke="var(--bg2)" stroke-width="2"/>'+lab+'</svg></div>';
}
function niceStep(r){const p=Math.pow(10,Math.floor(Math.log10(r||1)));const n=r/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p;}
function fmtAxis(v){return Math.abs(v)>=1000?(v/1000).toFixed(v%1000?1:0).replace('.',',')+'k':(Math.round(v*10)/10).toString().replace('.',',');}
function weekRange(w){const a=new Date(now.getTime()-(w*7+6)*DAY),b=new Date(now.getTime()-w*7*DAY);return w===0?'posledních 7 dní':fmtD(a.toISOString())+' – '+fmtD(b.toISOString());}
function barChart(data,opts){
 opts=opts||{};const W=320,H=opts.h||120,pt=10,pb=18;const mx=Math.max.apply(null,data.map(d=>d.v))||1;
 const bw=(W)/data.length;let s='';
 data.forEach((d,i)=>{const h=(H-pt-pb)*d.v/mx;const last=i===data.length-1;s+='<rect data-i="'+i+'" x="'+(i*bw+bw*.2).toFixed(1)+'" y="'+(H-pb-Math.max(h,2)).toFixed(1)+'" width="'+(bw*.6).toFixed(1)+'" height="'+Math.max(h,2).toFixed(1)+'" rx="5" fill="'+(last?'var(--accent)':'var(--ink)')+'" opacity="'+(last?1:.2)+'"/><text x="'+(i*bw+bw/2).toFixed(1)+'" y="'+(H-4)+'" text-anchor="middle">'+esc(d.l)+'</text>';});
 const tips=data.map(d=>d.tip||String(d.v));
 return '<div class="chart bars" data-tips="'+esc(JSON.stringify(tips))+'"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opts.label||'graf')+'">'+s+'</svg><div class="ctip" hidden></div></div>';
}

function statsBlocks(id,vol){let h='';const wt=weightTrend(id);
  const exs=exList(id);if(!UI.liftSel||!exs.includes(UI.liftSel))UI.liftSel=exs[0];
  if(exs.length){const ps=exProgress(id,UI.liftSel);const kgMode=ps.some(p=>p.kg>0);const series=ps.map(p=>({d:p.d,v:kgMode?Math.round(cv(p.kg)*10)/10:p.reps}));
   const first=series[0],lastp=series[series.length-1];const dl=lastp&&first?Math.round((lastp.v-first.v)*10)/10:0;const best=ps.reduce((b,p)=>(kgMode?(p.kg>b.kg||(p.kg===b.kg&&p.reps>b.reps)):(p.reps>b.reps))?p:b,ps[0]);
   const est=kgMode?Math.round(Math.max.apply(null,ps.map(p=>p.e1))*10)/10:0;const unit=kgMode?' '+U():' opak.';const f=v=>String(v).replace('.',',');
   h+='<div class="glass card stack" style="gap:12px"><div class="row between"><span class="title-m">Progres cviku</span>'+(series.length>1?'<span class="delta '+(dl>=0?'up':'down')+'">'+(dl>=0?'+':'')+f(dl)+unit+'</span>':'')+'</div>'
    +'<select class="sel-ex" id="ex-pick" data-in="liftSel" aria-label="Vyber cvik">'+exs.map(n=>'<option value="'+esc(n)+'"'+(n===UI.liftSel?' selected':'')+'>'+esc(n)+'</option>').join('')+'</select>'
    +lineChart(series,{label:(kgMode?'Nejtěžší série v '+U():'Nejvíc opakování')})
    +'<div class="grid3"><div class="stack" style="gap:2px"><span class="tiny faint">Teď</span><span class="num" style="font-weight:600">'+f(lastp.v)+unit+'</span></div><div class="stack" style="gap:2px"><span class="tiny faint">Nejlepší série</span><span class="num" style="font-weight:600">'+best.reps+(kgMode?' × '+W(best.kg):' opak.')+'</span></div><div class="stack" style="gap:2px"><span class="tiny faint">'+(kgMode?'Odhad 1RM':'Odcvičeno')+'</span><span class="num" style="font-weight:600">'+(kgMode?W(est):ps.length+'×')+'</span></div></div>'
    +'<span class="tiny faint">'+(kgMode?'Graf ukazuje nejtěžší sérii v každém tréninku. ':'')+'Cvik odcvičen '+ps.length+'× od '+fmtD(ps[0].d)+'.</span><button class="btn ghost sm" style="align-self:flex-start" data-a="exhist" data-v="'+esc(id+'|'+UI.liftSel)+'">'+ic('trend',16)+' Celá historie cviku</button></div>';}

  h+='<div class="glass card stack" style="gap:6px"><div class="row between"><span class="title-m">Objem za týden</span><span class="tiny faint">'+U()+' × opakování</span></div>'+barChart(vol.map((x,i)=>({v:x.v,l:i===7?'teď':'-'+x.w+'t',tip:'<b>'+Math.round(cv(x.v)).toLocaleString('cs-CZ')+' '+U()+'</b>'+x.n+' '+pl(x.n,'trénink','tréninky','tréninků')+' · '+weekRange(x.w)})),{label:'Týdenní objem'})+'</div>';
 return h;
}

const CATS=['Síla','Hypertrofie','Kondice','Rehabilitace','Mobilita'];

function idots(sets){return '<span class="idots">'+sets.map(x=>'<i style="background:'+(IDOT[x.int]||'var(--chip)')+'"></i>').join('')+'</span>';}
function exTimed(e){return /s$/.test(String(e.sets[0]&&e.sets[0].reps||'').trim());}
function exSummary(e){const work=e.sets.filter(x=>x.int!=='Rozcvička'),w=work.length?work:e.sets,r=w.map(x=>String(x.reps||'').trim()),same=r.every(v=>v===r[0]);
 if(same&&r[0])return e.sets.length+' × '+(/^\d+$/.test(r[0])?r[0]:r[0]);
 if(same&&!r[0]){const ints=w.map(x=>x.int),si=ints.every(v=>v===ints[0]);return e.sets.length+' '+pl(e.sets.length,'série','série','sérií')+' · '+(si&&ints[0]?repsTxt('',ints[0]).toLowerCase():'bez počtu');}
 const nums=r.filter(Boolean);return e.sets.length+' '+pl(e.sets.length,'série','série','sérií')+(nums.length?' · '+nums.join('/'):'');}

app.addEventListener('input',e=>{
 const k=e.target.getAttribute('data-in');if(!k)return;const v=e.target.value;
 if(k==='acq'){UI.acq=v;const pos=e.target.selectionStart;rerender();const q=document.getElementById('ac-q');if(q){q.focus();try{q.setSelectionRange(pos,pos);}catch(_){}}return;}
 if(k==='tq'){UI.tq=v;const pos=e.target.selectionStart;rerender();const q=document.getElementById('tq');if(q){q.focus();try{q.setSelectionRange(pos,pos);}catch(_){}}return;}
 if(k==='hq'){UI.hq=v;const on=!!v.trim(),r=document.getElementById('hres'),m=document.getElementById('hmain'),x=document.querySelector('.hqx');if(r){r.innerHTML=homeSearch(v);r.hidden=!on;}if(m)m.hidden=on;if(x)x.hidden=!v;return;}
 if(k==='q'){UI.q=v;const pos=e.target.selectionStart;rerender();const q=document.getElementById('q');if(q){q.focus();try{q.setSelectionRange(pos,pos);}catch(_){}}return;}
 if(k==='noteDraft'||k==='commentDraft'){UI[k]=v;return;}
 if(k==='liftSel'){UI.liftSel=v;rerender();return;}
 if(k==='sheetNote'){UI.sheet.note=v;return;}
 if(k.startsWith('wo.')&&S.active){const [,i,j,f]=k.split('.');const x=S.active.ex[+i]&&S.active.ex[+i].sets[+j];if(x){x[f]=v;if(f==='rir')e.target.className='isel sm '+(ICLS[v]||'ip-none');save();}return;}
 if(k==='finNote'){UI.sheet.note=v;return;}
 if(k.startsWith('ci.')&&UI.ci){UI.ci[k.slice(3)]=v;return;}
 if(k==='painTxt'&&UI.sheet){UI.sheet.txt=v;return;}
 if(k==='wkg'||k==='ccode'){UI[k]=v;return;}
 if(k.startsWith('c.')){me()[k.slice(2)]=v;return;}
 if(k==='exq'){UI.exq=v;const pos=e.target.selectionStart;rerender();const q=document.getElementById('exq');if(q){q.focus();try{q.setSelectionRange(pos,pos);}catch(_){}}return;}
 if(k.startsWith('exf.')){UI.exf[k.slice(4)]=v;if(k==='exf.mu')rerender();return;}
 if(k.startsWith('rep.')){UI.report[k.slice(4)]=v;return;}
 if(k.startsWith('d.')){UI.draft[k.slice(2)]=v;return;}
 if(k.startsWith('s.')){const [,id,idx,f]=k.split('.');const ex=UI.draft.ex.find(x=>x.id===id);if(ex&&ex.sets[+idx]){ex.sets[+idx][f]=v;if(f==='int')e.target.className='isel '+(ICLS[v]||'ip-none');}return;}
 if(k.startsWith('er.')){const ex=UI.draft.ex.find(x=>x.id===k.slice(3));if(ex){const n=String(v).replace(/\D/g,'').slice(0,3);if(n!==v)e.target.value=n;const tm=exTimed(ex),w=ex.sets.filter(x=>x.int!=='Rozcvička');(w.length?w:ex.sets).forEach(x=>{x.reps=n?(tm?n+' s':n):'';});const fb=document.querySelector('[data-a=exfree] .pkbox');if(fb){fb.classList.toggle('on',!n);fb.innerHTML=n?'':ic('check',15,3);}}return;}
 if(k.startsWith('e.')){const [,id,f]=k.split('.');const ex=UI.draft.ex.find(x=>x.id===id);if(ex)ex[f]=v;return;}
 if(k.startsWith('t.')){S.trainer[k.slice(2)]=v;return;}
});
app.addEventListener('change',e=>{
 const f=e.target.getAttribute('data-file');if(!f)return;const files=[...e.target.files];if(!files.length)return;
 if(f.startsWith('chat:')){const cid=f.slice(5);UI.sheet=null;rerender();
  files.forEach(file=>{const isV=file.type.startsWith('video');
   if(isV){toast('Nahrávám video…');upload(file).then(src=>{S.messages[cid].push(msgOut({kind:'video',src:src,text:''}));save();render('bottom');}).catch(e=>toast('Video se nepodařilo nahrát. '+(e.message||'')));}
   else{const r=new FileReader();r.onload=()=>downscale(r.result,1000).then(url=>{S.messages[cid].push(msgOut({kind:'photo',src:url,text:''}));save();render('bottom');});r.readAsDataURL(file);}});
  return;}
 if(f.startsWith('ci:')&&UI.ci){const k=+f.slice(3),file=files[0];const r=new FileReader();r.onload=()=>downscale(r.result,640).then(url=>{UI.ci.photos[k]=url;rerender();});r.readAsDataURL(file);return;}
 if(f==='avatar'){const file=files[0];const r=new FileReader();r.onload=()=>{downscale(r.result,320).then(url=>{(isC()?me():S.trainer).photo=url;save();toast('Fotka nastavena');});};r.readAsDataURL(file);return;}
 const ex=UI.draft&&UI.draft.ex.find(x=>x.id===f);if(!ex)return;
 files.forEach(file=>{const isV=file.type.startsWith('video');const m={id:uid(),kind:isV?'video':'photo',name:file.name,src:''};ex.media.push(m);
  if(isV){upload(file).then(src=>{m.src=src;rerender();}).catch(e=>{ex.media=ex.media.filter(x=>x!==m);rerender();toast('Video se nepodařilo nahrát. '+(e.message||''));});}
  else{const r=new FileReader();r.onload=()=>downscale(r.result,1200).then(url=>{m.src=url;rerender();});r.readAsDataURL(file);}});
 rerender();toast(files.some(f=>f.type.startsWith('video'))?'Nahrávám…':files.length===1?'Médium přidáno':files.length+' médií přidáno');
});
function downscale(src,max){return new Promise(res=>{const img=new Image();img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);try{res(c.toDataURL('image/jpeg',.85));}catch(e){res(src);}};img.onerror=()=>res(src);img.src=src;});}
app.addEventListener('submit',e=>{
 e.preventDefault();const form=e.target;const k=form.getAttribute('data-form');
 const busy=b=>{const bt=form.querySelector('button[type=submit]');if(bt){bt.disabled=b;bt.style.opacity=b?.6:'';}};
 const val=id=>{const el=document.getElementById(id);return el?el.value.trim():'';};
 if(k==='login'||k==='clogin'){const p=k==='login'?'l':'cl';busy(true);
  sb.auth.signInWithPassword({email:val(p+'-email').toLowerCase(),password:document.getElementById(p+'-pass').value}).then(({data,error})=>{busy(false);if(error)return toast(authErr(error));boot(data.session);});return;}
 if(k==='register'){const n=val('r-name'),em=val('r-email').toLowerCase(),sp=val('r-spec'),pw=document.getElementById('r-pass').value;busy(true);
  sb.auth.signUp({email:em,password:pw,options:{data:{role:'trainer',name:n,spec:sp},emailRedirectTo:location.origin}}).then(({data,error})=>{busy(false);if(error)return toast(authErr(error));
   if(data.session)boot(data.session);else{UI.app='trainer';UI.verifyEmail=em;UI.authStep='verify';render('push');}});return;}
 if(k==='creg'){const r={code:val('cr-code'),name:val('cr-name'),goal:val('cr-goal'),email:val('cr-email').toLowerCase()};UI.creg=r;const pw=document.getElementById('cr-pass')?document.getElementById('cr-pass').value:'';busy(true);
  sb.rpc('trainer_by_code',{p_code:r.code}).then(({data,error})=>{
   if(error||!data){busy(false);UI.cregErr=error?'Kód teď nejde ověřit, zkus to prosím znovu.':'Tenhle kód nepatří žádnému trenérovi. Zkontroluj ho u svého trenéra.';render();const el=document.getElementById('cr-code');if(el)el.focus();return;}
   UI.cregErr='';
   sb.auth.signUp({email:r.email,password:pw,options:{data:{role:'client',code:r.code,name:r.name,goal:r.goal},emailRedirectTo:location.origin}}).then(({data:d2,error:e2})=>{busy(false);if(e2)return toast(authErr(e2));
    if(d2.session)boot(d2.session);else{UI.app='client';UI.verifyEmail=r.email;UI.authStep='verify';render('push');}});});return;}
 if(k==='forgot'){const em=val('fg-email').toLowerCase();busy(true);sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin}).then(({error})=>{busy(false);if(error)return toast(authErr(error));UI.authStep='welcome';render('pop');toast('Odkaz jsme poslali na '+em);});return;}
 if(k==='newpass'){const pw=document.getElementById('np-pass').value;busy(true);sb.auth.updateUser({password:pw}).then(({data,error})=>{busy(false);if(error)return toast(authErr(error));toast('Heslo změněno');UI.recovery=false;bootUid=null;sb.auth.getSession().then(r=>boot(r.data.session));});return;}
 if(k==='chat'){const cid=form.getAttribute('data-v');const inp=document.getElementById('chat-in');const v=inp.value.trim();if(!v)return;
  S.messages[cid].push(msgOut({text:v}));save();render('bottom');const ni=document.getElementById('chat-in');if(ni)ni.focus();
  if(isC())trainerReply(cid);else clientReply(cid);
 }
});
function addClient(n){if(!n){const names=['Adéla Marková','Filip Kučera','Simona Pokorná','Daniel Fiala','Nikola Růžičková','Ondřej Kos','Tereza Bílá'];const used=S.clientsAll.map(c=>c.name);n=names.find(x=>!used.includes(x))||('Nový klient '+(S.clientsAll.length+1));}
 const c={id:'c'+uid(),trainerId:S.me,name:n,goal:'Zatím nevyplněno',joined:new Date().toISOString(),target:2,photo:null,status:'active'};S.clientsAll.push(c);S.messages[c.id]=[{id:uid(),by:'client',text:'Ahoj, právě jsem se připojil(a) přes tvůj kód!',at:new Date().toISOString(),read:false}];S.notes[c.id]=[];save();return c;}
let noticeT;
function notify(kind,title,body,route,fallback){
 const np_=isC()?S.cnotif:S.notif;if(!(np_.on&&np_[kind])){if(fallback)toast('Oznámení tohoto typu máš vypnuté');else rerender();return;}
 UI.notice={title:title,body:body,route:route};rerender();clearTimeout(noticeT);noticeT=setTimeout(()=>{UI.notice=null;const el=app.querySelector('.notif');if(el)el.remove();},5000);}

/* workout clock: updates the running timer and rest countdown every second */
/* time comes from the start timestamp, so it stays correct while the phone is locked or the app is in the background */
function woTick(){if(!S.authed||!isC()||!S.active)return;const w=S.active;
 app.querySelectorAll('[data-tick=wo]').forEach(el=>el.textContent=fmtClock(elapsed()));
 const d=new Date();app.querySelectorAll('[data-tick=lsclock]').forEach(el=>el.textContent=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0'));
 if(w.restUntil){const r=Math.ceil((w.restUntil-Date.now())/1000);app.querySelectorAll('[data-tick=rest]').forEach(el=>el.textContent=fmtClock(Math.max(0,r)));app.querySelectorAll('[data-tick=restbar]').forEach(el=>el.style.width=(w.restTotal?Math.max(0,r)/w.restTotal*100:0)+'%');
  if(r<=0){w.restUntil=0;save();try{if(navigator.vibrate)navigator.vibrate([200,100,200]);}catch(e){}
   const ae=document.activeElement,fid=ae&&ae.id,pos=ae&&ae.selectionStart;if(current()==='workout'||UI.lock){rerender();if(fid){const el=document.getElementById(fid);if(el){el.focus();try{el.setSelectionRange(pos,pos);}catch(_){}}}}toast('Pauza skončila, jdeme na další sérii');}}}
setInterval(woTick,1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)woTick();});
function refocus(){const ni=document.getElementById('chat-in');if(ni&&document.activeElement!==ni){/* keep keyboard */}}

UI.booting=true;render();
sb.auth.onAuthStateChange((ev,session)=>{
 if(ev==='PASSWORD_RECOVERY'){UI.recovery=true;UI.booting=false;S.authed=false;UI.authStep='newpass';render();return;}
 if(UI.recovery)return;
 if(ev==='INITIAL_SESSION'||ev==='SIGNED_IN')setTimeout(()=>boot(session),0);
});

document.addEventListener('visibilitychange',()=>{if(document.hidden)flushNow();});
})();
